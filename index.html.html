<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>節拍忍者</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen dojo. HUD row, master's coaching strip, falling-note stage, one big tap pad. Committed night-indigo look. */
:root{
  --ink:#12172E; --ink2:#1B2347; --line:rgba(255,255,255,.10);
  --paper:#EEF1FF; --mute:#98A3D6;
  --pink:#FF7A9C; --teal:#46DCCB; --gold:#FFC94D; --red:#F0503E;
  --f-display:"Zen Maru Gothic","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"Fredoka","Zen Maru Gothic","Noto Sans TC",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  background:var(--ink);color:var(--paper);font-family:var(--f-body);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px;overflow:hidden;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px}

.hud{display:grid;grid-template-columns:1.3fr .9fr .9fr 1.5fr auto;gap:6px;align-items:end}
.stat{display:flex;flex-direction:column;gap:1px;min-width:0}
.stat small{font-size:11px;color:var(--mute);letter-spacing:.08em;white-space:nowrap}
.stat b{font-family:var(--f-num);font-size:22px;line-height:1.05;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat.lv b{font-family:var(--f-display);font-size:15px;font-weight:900;line-height:1.5}
.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:13px}
.ghost:active{background:var(--ink2)}

.coach{display:flex;gap:10px;align-items:center;background:var(--ink2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-height:54px}
.seal{flex:none;width:30px;height:30px;background:var(--red);color:#fff;font-family:var(--f-display);font-weight:900;display:grid;place-items:center;border-radius:4px;transform:rotate(-4deg)}
.coach p{margin:0;font-size:13.5px;line-height:1.45;flex:1;min-width:0}
.chip{flex:none;font-size:11px;color:var(--mute);text-align:right;line-height:1.2;letter-spacing:.04em}
.chip b{display:block;font-family:var(--f-num);font-size:20px;color:var(--paper);letter-spacing:0}

.stage{position:relative;flex:1;min-height:0;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#0E1226}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.prog{position:absolute;left:0;right:0;top:0;height:3px;background:rgba(255,255,255,.08)}
.prog i{display:block;height:100%;width:0;background:var(--gold)}

.pad{flex:none}
#tap{width:100%;height:68px;border:0;border-radius:18px;background:var(--gold);color:#2A2108;font-family:var(--f-display);font-weight:900;font-size:28px;letter-spacing:.3em;box-shadow:0 6px 0 #C79A22;transition:transform .04s,box-shadow .04s;touch-action:manipulation;line-height:1.1}
#tap.down{transform:translateY(4px);box-shadow:0 2px 0 #C79A22}
#tap small{display:block;font-family:var(--f-body);font-size:11px;letter-spacing:.06em;font-weight:500;opacity:.7;margin-top:2px}

.overlay{position:fixed;inset:0;z-index:20;background:rgba(14,18,38,.95);overflow:auto;display:flex;
  padding:max(18px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(18px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{width:100%;max-width:520px;margin:auto;display:flex;flex-direction:column;gap:16px}
.title{display:flex;align-items:center;gap:12px}
.title h1{font-family:var(--f-display);font-weight:900;font-size:42px;line-height:1.05;margin:0;text-wrap:balance}
.title .seal{width:38px;height:38px;font-size:22px;border-radius:5px}
.sub{margin:-8px 0 0;color:var(--mute);letter-spacing:.22em;font-size:14px}
.lead{margin:0;font-size:15px;line-height:1.6}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{background:var(--ink2);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.card canvas{position:static;width:84px;height:62px}
.card h3{font-size:14px;margin:0;font-weight:700}
.card .act{font-family:var(--f-display);font-weight:900;font-size:16px}
.card p{margin:0;font-size:12px;color:var(--mute);line-height:1.35}
.opt{display:flex;flex-direction:column;gap:8px}
.opt h2{margin:0;font-size:13px;color:var(--mute);font-weight:500;letter-spacing:.08em}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--ink2);border-radius:10px;padding:9px 4px;font-size:13px;line-height:1.35;text-align:center}
.seg button small{display:block;color:var(--mute);font-size:11px}
.seg button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#2A2108;font-weight:700}
.seg button[aria-pressed="true"] small{color:#4a3a10}
.row{display:flex;align-items:center;gap:10px;font-size:14px;min-width:0}
.row input[type=checkbox]{width:20px;height:20px;accent-color:var(--gold);flex:none}
.row input[type=range]{flex:1;min-width:0;accent-color:var(--gold)}
.row output{font-family:var(--f-num);min-width:4.5em;text-align:right;font-variant-numeric:tabular-nums}
.hintline{margin:0;font-size:12px;color:var(--mute);line-height:1.5}
.go{width:100%;border:0;border-radius:16px;background:var(--gold);color:#2A2108;font-family:var(--f-display);font-weight:900;font-size:22px;letter-spacing:.2em;padding:16px;box-shadow:0 5px 0 #C79A22}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 #C79A22}
.go.alt{background:transparent;color:var(--paper);border:1px solid var(--line);box-shadow:none;font-size:16px;letter-spacing:.1em;padding:12px}
.best{margin:0;text-align:center;font-size:12.5px;color:var(--mute)}

.stars{display:flex;justify-content:center;gap:6px}
.stars svg{width:46px;height:46px}
.res-h{text-align:center;display:flex;flex-direction:column;gap:6px}
.res-h h2{margin:0;font-family:var(--f-display);font-weight:900;font-size:26px;text-wrap:balance}
.res-h p{margin:0;color:var(--mute);font-size:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kv{background:var(--ink2);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;min-width:0}
.kv small{display:block;font-size:11px;color:var(--mute)}
.kv b{font-family:var(--f-num);font-size:20px;font-variant-numeric:tabular-nums}
.kv b.t{font-family:var(--f-display);font-size:15px}
.bars{display:flex;flex-direction:column;gap:8px}
.brow{display:grid;grid-template-columns:5.2em 1fr 3em;gap:8px;align-items:center;font-size:13px}
.brow span:last-child{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.track{height:10px;border-radius:6px;background:rgba(255,255,255,.10);overflow:hidden}
.fill{height:100%;border-radius:6px}
.traj{display:flex;gap:3px;align-items:flex-end;height:92px}
.traj div{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:3px}
.traj i{display:block;width:100%;border-radius:3px 3px 0 0}
.traj em{font-style:normal;font-family:var(--f-num);font-size:9px;color:var(--mute);font-variant-numeric:tabular-nums}
.cap{margin:0;font-size:12px;color:var(--mute)}
.note{background:var(--ink2);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:flex-start}
.note p{margin:0;font-size:14px;line-height:1.55;flex:1}
.pause-sheet{text-align:center}
.pause-sheet h2{margin:0;font-family:var(--f-display);font-weight:900;font-size:30px}
@media (max-width:380px){
  .title h1{font-size:36px}
  .stat b{font-size:19px}
  #tap{height:62px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app">
  <header class="hud">
    <div class="stat"><small>分數</small><b id="hScore">0</b></div>
    <div class="stat"><small>連擊</small><b id="hCombo">0</b></div>
    <div class="stat"><small>速度</small><b id="hBpm">--</b></div>
    <div class="stat lv"><small>等級</small><b id="hLv">--</b></div>
    <button class="ghost" id="btnPause" type="button">暫停</button>
  </header>
  <section class="coach" aria-live="polite">
    <div class="seal" aria-hidden="true">師</div>
    <p id="coachMsg">按「開始修練」,跟著節拍器出發。</p>
    <div class="chip">最近正確率<b id="hAcc">--</b></div>
  </section>
  <main class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="prog"><i id="prog"></i></div>
  </main>
  <footer class="pad">
    <button id="tap" type="button">切!<small>點這裡 / 空白鍵 / F / J</small></button>
  </footer>
</div>

<div class="overlay" id="menu">
  <div class="sheet">
    <div class="title"><div class="seal" aria-hidden="true">切</div><h1>節拍忍者</h1></div>
    <p class="sub">音符切切樂</p>
    <p class="lead">音符會從上面落下來。等它碰到金線的那一刻,把它切開!跟著節拍器的聲音,手要準。</p>
    <div class="cards">
      <div class="card"><canvas data-k="Q" width="84" height="62"></canvas><h3>四分音符</h3><div class="act" style="color:var(--pink)">點 1 下</div><p>一拍 = ta</p></div>
      <div class="card"><canvas data-k="E" width="84" height="62"></canvas><h3>八分音符</h3><div class="act" style="color:var(--teal)">快點 2 下</div><p>一拍 = ti-ti</p></div>
      <div class="card"><canvas data-k="R" width="84" height="62"></canvas><h3>休止符</h3><div class="act" style="color:var(--mute)">不要點</div><p>這一拍休息</p></div>
    </div>
    <div class="opt">
      <h2>從哪裡開始?師父會依你的表現調整速度和難度</h2>
      <div class="seg" id="segStart">
        <button type="button" data-k="1" aria-pressed="true">入門<small>四分音符</small></button>
        <button type="button" data-k="3" aria-pressed="false">進階<small>三種音符</small></button>
        <button type="button" data-k="5" aria-pressed="false">挑戰<small>速度較快</small></button>
      </div>
    </div>
    <div class="opt">
      <label class="row"><input type="checkbox" id="optHints" checked> 顯示唱拍提示(ta / ti-ti)</label>
      <label class="row">點擊延遲校正 <input type="range" id="optLat" min="-150" max="150" step="10" value="0"><output id="optLatOut" for="optLat">0 毫秒</output></label>
      <p class="hintline">常常顯示「晚了一點」(例如用藍牙設備),就把數字調大;常常顯示「早了一點」就調小。</p>
    </div>
    <button class="go" id="btnStart" type="button">開始修練</button>
    <p class="best" id="bestLine" hidden></p>
  </div>
</div>

<div class="overlay" id="pauseOv" hidden>
  <div class="sheet pause-sheet">
    <h2>暫停中</h2>
    <p class="lead">深呼吸,準備好了就繼續。</p>
    <button class="go" id="btnResume" type="button">繼續</button>
    <button class="go alt" id="btnQuit" type="button">回首頁</button>
  </div>
</div>

<div class="overlay" id="result" hidden>
  <div class="sheet" id="resultBody"></div>
</div>

<script>
(function(){
'use strict';

/*AI-START*/
function makeAI(level,bpm,rng){
  rng=rng||Math.random;
  var NAMES=['見習忍者','下忍','中忍','上忍','影忍','忍頭','師範','宗師'];
  var TYPE={Q:'四分音符',E:'八分音符',R:'休止符'};
  var LV={
    1:{pE:0,pR:0,maxE:0,maxR:0},
    2:{pE:0,pR:.22,maxE:0,maxR:1},
    3:{pE:.28,pR:.16,maxE:1,maxR:1},
    4:{pE:.32,pR:.2,maxE:2,maxR:1},
    5:{pE:.4,pR:.2,maxE:2,maxR:2},
    6:{pE:.45,pR:.22,maxE:3,maxR:2},
    7:{pE:.55,pR:.2,maxE:3,maxR:2},
    8:{pE:.6,pR:.25,maxE:4,maxR:2}
  };
  var st={level:level,bpm:bpm,changeIdx:1,history:[],recent:[],
    intro:{E:level>=3,R:level>=2},weak:null,weakShown:null,last:'',maxLevel:level,maxBpm:bpm};

  function noteResult(type,ok){
    st.recent.push({type:type,ok:ok});
    if(st.recent.length>14) st.recent.shift();
  }
  function report(idx,ok,tot){ st.history.push({idx:idx,ok:ok,tot:tot}); }
  function rolling(){
    var h=st.history.slice(-2),ok=0,tot=0;
    h.forEach(function(x){ok+=x.ok;tot+=x.tot;});
    return tot?ok/tot:null;
  }
  function weakType(){
    var agg={Q:{n:0,ok:0},E:{n:0,ok:0},R:{n:0,ok:0}};
    st.recent.forEach(function(r){agg[r.type].n++; if(r.ok) agg[r.type].ok++;});
    var w=null,wa=0.75;
    ['E','R','Q'].forEach(function(t){
      var a=agg[t];
      if(a.n>=3){var acc=a.ok/a.n; if(acc<wa){wa=acc;w=t;}}
    });
    return w;
  }
  function gen(force){
    var c=LV[st.level],pE=c.pE,pR=c.pR,weak=st.weak;
    if(weak==='E'&&c.pE>0) pE=Math.min(.7,pE*1.7+.08);
    if(weak==='R'&&c.pR>0) pR=Math.min(.4,pR*1.7+.06);
    if(weak==='Q'){pE*=.5;pR*=.5;}
    for(var tries=0;tries<40;tries++){
      var t=[],nE=0,nR=0,i;
      for(i=0;i<4;i++){
        var r=rng(),k='Q';
        if(r<pR) k='R'; else if(r<pR+pE) k='E';
        if(k==='R'&&(nR>=c.maxR||(i===0&&st.level<=3)||(i>0&&t[i-1]==='R'&&st.level<=5))) k='Q';
        if(k==='E'&&nE>=c.maxE) k='Q';
        if(k==='R') nR++;
        if(k==='E') nE++;
        t.push(k);
      }
      if(force&&t.indexOf(force)<0){
        var slots=[];
        for(i=0;i<4;i++){
          if(t[i]!=='Q') continue;
          if(force==='R'&&((i===0&&st.level<=3)||(i>0&&t[i-1]==='R'))) continue;
          slots.push(i);
        }
        if(!slots.length) continue;
        t[slots[Math.floor(rng()*slots.length)]]=force;
      }
      if(st.level>1&&t.join('')===st.last&&tries<39) continue;
      return t;
    }
    return ['Q','Q','Q','Q'];
  }
  function next(idx){
    var msg=null,changed=false;
    st.weak=weakType();
    var ent=st.history.filter(function(x){return x.idx>=st.changeIdx;}).slice(-2);
    if(ent.length){
      var ok=0,tot=0;
      ent.forEach(function(x){ok+=x.ok;tot+=x.tot;});
      var acc=tot?ok/tot:1,pct=Math.round(acc*100);
      if(ent.length>=2&&acc>=.9){
        var cap=Math.min(108,66+st.level*6);
        if(st.bpm+6<=cap){st.bpm+=6;msg='正確率 '+pct+'%!速度加快到 '+st.bpm+' 拍。';changed=true;}
        else if(st.level<8){
          st.level++;st.bpm=Math.max(54,st.bpm-12);changed=true;
          msg='正確率 '+pct+'%,升級到「'+NAMES[st.level-1]+'」!節奏會變得更密。';
        } else msg='正確率 '+pct+'%!你已經是宗師了,繼續保持。';
      } else if((ent.length===1&&acc<.55)||(ent.length>=2&&acc<.65)){
        if(st.bpm>54){st.bpm-=6;msg='正確率 '+pct+'%,先放慢到 '+st.bpm+' 拍,穩穩跟著節拍器。';changed=true;}
        else if(st.level>1){st.level--;msg='先回到「'+NAMES[st.level-1]+'」的練習,把基本功練穩。';changed=true;}
        else if(st.bpm>48){st.bpm-=6;msg='再放慢一點,到 '+st.bpm+' 拍。';changed=true;}
      }
    }
    if(changed) st.changeIdx=idx;
    var force=null;
    if(st.level>=3&&!st.intro.E) force='E';
    else if(st.level>=2&&!st.intro.R) force='R';
    var tokens=gen(force);
    if(force&&tokens.indexOf(force)>=0){
      st.intro[force]=true;
      msg=force==='E'?'新招「八分音符」!一拍裡快速點兩下,口訣 ti-ti。':'新招「休止符」!看到灰色框,這一拍手要停住。';
    }
    if(!msg&&st.weak&&st.weak!==st.weakShown){
      msg='師父發現「'+TYPE[st.weak]+'」還不太穩,接下來多練幾次。';
      st.weakShown=st.weak;
    }
    if(!st.weak) st.weakShown=null;
    st.last=tokens.join('');
    st.maxLevel=Math.max(st.maxLevel,st.level);
    st.maxBpm=Math.max(st.maxBpm,st.bpm);
    return {tokens:tokens,bpm:st.bpm,level:st.level,msg:msg,weak:st.weak};
  }
  return {st:st,noteResult:noteResult,report:report,next:next,rolling:rolling,names:NAMES};
}
/*AI-END*/

var $=function(s){return document.querySelector(s);};
var TOTAL=16;
var FD='"Zen Maru Gothic","Noto Sans TC",sans-serif',FN='"Fredoka","Noto Sans TC",sans-serif',FB='"Noto Sans TC",sans-serif';
var C={q:'#FF7A9C',e:'#46DCCB',r:'#9AA6D8',gold:'#FFC94D',red:'#F0503E',ink:'#12172E',paper:'#EEF1FF',mute:'#98A3D6',gray:'#5B6389'};
var START={1:{level:1,bpm:60},3:{level:3,bpm:66},5:{level:5,bpm:78}};
var TYPE_NAME={Q:'四分音符',E:'八分音符',R:'休止符'};
var clamp=function(v,a,b){return Math.max(a,Math.min(b,v));};

var S={phase:'menu',ctx:null,master:null,nb:null,measures:[],pending:[],fx:[],summary:[],ai:null,
  score:0,combo:0,maxCombo:0,extras:0,stats:null,t0:0,latency:0,hints:true,startKey:1,
  slashAt:-9,slashDir:1,flashAt:-9,done:false};

var cv=$('#cv'),g=cv.getContext('2d'),stage=$('#stage');
var W=300,H=500,DPR=1,L={};

/* ---------- audio ---------- */
function initAudio(){
  if(S.ctx) return;
  try{
    var AC=window.AudioContext||window.webkitAudioContext;
    S.ctx=new AC();
    S.master=S.ctx.createGain();S.master.gain.value=.85;S.master.connect(S.ctx.destination);
  }catch(e){S.ctx=null;}
}
function clock(){return S.ctx?S.ctx.currentTime:performance.now()/1000;}
function tone(time,freq,dur,type,vol){
  if(!S.ctx) return;
  var o=S.ctx.createOscillator(),gn=S.ctx.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,time);
  gn.gain.setValueAtTime(0.0001,time);
  gn.gain.exponentialRampToValueAtTime(vol,time+.005);
  gn.gain.exponentialRampToValueAtTime(0.0001,time+dur);
  o.connect(gn);gn.connect(S.master);o.start(time);o.stop(time+dur+.02);
}
function noiseBuf(){
  if(S.nb) return S.nb;
  var n=Math.floor(S.ctx.sampleRate*.2),b=S.ctx.createBuffer(1,n,S.ctx.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  S.nb=b;return b;
}
function swoosh(){
  if(!S.ctx) return;
  var t=S.ctx.currentTime,src=S.ctx.createBufferSource(),f=S.ctx.createBiquadFilter(),gn=S.ctx.createGain();
  src.buffer=noiseBuf();f.type='bandpass';
  f.frequency.setValueAtTime(1800,t);f.frequency.exponentialRampToValueAtTime(5200,t+.12);
  gn.gain.setValueAtTime(.2,t);gn.gain.exponentialRampToValueAtTime(.001,t+.14);
  src.connect(f);f.connect(gn);gn.connect(S.master);src.start(t);src.stop(t+.16);
}
function tick(time,accent){tone(time,accent?1500:1000,.05,'square',accent?.1:.055);}
function hitSound(type,perfect){
  if(!S.ctx) return;
  var t=S.ctx.currentTime;
  tone(t,type==='E'?880:620,.13,'triangle',.26);
  if(perfect) tone(t,type==='E'?1760:1240,.09,'sine',.09);
}
function buzz(){if(S.ctx) tone(S.ctx.currentTime,140,.2,'sawtooth',.1);}

/* ---------- timing windows (seconds) ---------- */
function goodWin(m){return clamp(.24*60/m.bpm,.14,.26);}
function perfWin(m){return clamp(.12*60/m.bpm,.07,.11);}
function restWin(m){return clamp(.3*60/m.bpm,.15,.3);}

/* ---------- timeline ---------- */
function addMeasure(isCount){
  var prev=S.measures[S.measures.length-1],idx=S.measures.length,startTime,startBeat;
  if(!prev){startTime=S.t0;startBeat=0;}
  else{startTime=prev.startTime+240/prev.bpm;startBeat=prev.startBeat+4;}
  var m={idx:idx,startTime:startTime,startBeat:startBeat,events:[],extras:0,clicked:[false,false,false,false],
    isCount:!!isCount,left:0,ok:0,tot:0,bpm:0,level:1,tokens:null};
  if(isCount){m.bpm=S.ai.st.bpm;m.level=S.ai.st.level;}
  else{
    var r=S.ai.next(idx);
    m.bpm=r.bpm;m.level=r.level;m.tokens=r.tokens;
    if(r.msg) setCoach(r.msg);
    buildEvents(m);
  }
  S.measures.push(m);
}
function buildEvents(m){
  var bs=60/m.bpm;
  function mk(type,i,sub){
    var ev={m:m,type:type,beat:m.startBeat+i+sub,time:m.startTime+(i+sub)*bs,status:'pending',sub:sub,partner:null,dt:0};
    m.events.push(ev);S.pending.push(ev);m.left++;return ev;
  }
  m.tokens.forEach(function(k,i){
    if(k==='E'){var a=mk('E',i,0),b=mk('E',i,.5);a.partner=b;b.partner=a;}
    else mk(k,i,0);
  });
}
function ensureMeasures(now){
  while(S.measures.length<TOTAL+1){
    var last=S.measures[S.measures.length-1],lastEnd=last.startTime+240/last.bpm;
    if(lastEnd-now<4.2*60/last.bpm) addMeasure(false); else break;
  }
}
function scheduleClicks(now){
  if(!S.ctx) return;
  S.measures.forEach(function(m){
    if(m.startTime>now+.4||m.startTime+240/m.bpm<now-.2) return;
    for(var i=0;i<4;i++){
      if(m.clicked[i]) continue;
      var t=m.startTime+i*60/m.bpm;
      if(t<=now+.12){m.clicked[i]=true; if(t>=now-.05) tick(Math.max(t,now),i===0);}
    }
  });
}
function curBeat(now){
  var ms=S.measures;if(!ms.length) return 0;
  var m=ms[0];
  for(var i=ms.length-1;i>=0;i--){if(now>=ms[i].startTime){m=ms[i];break;}}
  return m.startBeat+(now-m.startTime)*m.bpm/60;
}
function measureAt(t){
  for(var i=S.measures.length-1;i>=0;i--){
    var m=S.measures[i];
    if(t>=m.startTime&&t<m.startTime+240/m.bpm) return m;
  }
  return null;
}

/* ---------- judging ---------- */
function addText(text,color,size){S.fx.push({k:'text',t:clock(),x:L.cx,y:L.hitY-48,text:text,color:color,size:size||20,life:.75});}
function resolve(ev,status,dt){
  var ok=status==='perfect'||status==='good'||status==='rest-ok';
  ev.status=status;ev.dt=dt;
  var ix=S.pending.indexOf(ev);if(ix>=0) S.pending.splice(ix,1);
  var m=ev.m;m.left--;m.tot++;if(ok) m.ok++;
  S.stats[ev.type].n++;if(ok) S.stats[ev.type].ok++;
  S.ai.noteResult(ev.type,ok);
  if(ok){
    S.combo++;S.maxCombo=Math.max(S.maxCombo,S.combo);
    var base=status==='perfect'?100:status==='good'?60:40;
    S.score+=Math.round(base*(1+Math.min(Math.floor(S.combo/5),4)*.25));
  }else S.combo=0;
  if(m.left===0){
    var tot=m.tot+m.extras;
    S.ai.report(m.idx,m.ok,tot);
    S.summary.push({idx:m.idx,bpm:m.bpm,level:m.level,ok:m.ok,tot:tot});
  }
}
function onTap(){
  if(S.phase!=='play') return;
  var now=clock(),t=now-S.latency/1000;
  S.slashAt=now;S.slashDir*=-1;
  swoosh();
  var first=S.measures[1];
  if(!first||t<first.startTime-.3) return;
  var best=null,bd=1e9;
  for(var i=0;i<S.pending.length;i++){
    var ev=S.pending[i],w=ev.type==='R'?restWin(ev.m):goodWin(ev.m),d=Math.abs(t-ev.time);
    if(d<=w&&d<bd){best=ev;bd=d;}
  }
  if(!best){
    S.combo=0;S.extras++;
    var mm=measureAt(t);if(mm&&!mm.isCount&&mm.left>0) mm.extras++;
    addText('多點了',C.mute,17);
    return;
  }
  var dt=t-best.time;
  if(best.type==='R'){
    resolve(best,'rest-broken',dt);addText('休止符要停住!',C.red,19);buzz();
  }else{
    var pf=bd<=perfWin(best.m);
    resolve(best,pf?'perfect':'good',dt);
    S.flashAt=now;
    S.fx.push({k:'split',t:now,type:best.type,x:L.cx,y:L.hitY,life:.5});
    hitSound(best.type,pf);
    if(pf) addText('完美!',C.gold,24);
    else addText(dt<0?'早了一點':'晚了一點',C.paper,18);
  }
}
function update(now){
  var tn=now-S.latency/1000;
  for(var i=S.pending.length-1;i>=0;i--){
    var ev=S.pending[i];
    if(ev.type==='R'){
      if(tn>ev.time+restWin(ev.m)){resolve(ev,'rest-ok',0);S.fx.push({k:'text',t:now,x:L.cx,y:L.hitY-48,text:'休息 OK',color:C.teal,size:15,life:.6});}
    }else if(tn>ev.time+goodWin(ev.m)){
      resolve(ev,'miss',0);addText('漏掉',C.mute,17);
    }
  }
}
function checkEnd(now){
  if(S.measures.length<TOTAL+1||S.pending.length) return;
  var last=S.measures[S.measures.length-1];
  if(now>last.startTime+240/last.bpm+.35) finishGame();
}

/* ---------- coach / HUD ---------- */
function setCoach(msg){S.coachMsg=msg;}
var cache={};
function setText(id,v){
  if(cache[id]===v) return;
  cache[id]=v;$(id).textContent=v;
}
function hud(now){
  setText('#hScore',String(S.score));
  setText('#hCombo',String(S.combo));
  var m=null;
  for(var i=S.measures.length-1;i>=0;i--){if(now>=S.measures[i].startTime){m=S.measures[i];break;}}
  var bpm=m?m.bpm:S.ai.st.bpm,lv=m?m.level:S.ai.st.level;
  setText('#hBpm',String(bpm));
  setText('#hLv','Lv'+lv+' '+S.ai.names[lv-1]);
  setText('#coachMsg',S.coachMsg||'');
  var r=S.ai.rolling();
  setText('#hAcc',r===null?'--':Math.round(r*100)+'%');
  var idx=m?m.idx:0;
  $('#prog').style.width=clamp(idx/TOTAL*100,0,100)+'%';
}

/* ---------- glyphs ---------- */
function glyphQuarter(c,x,y,s,col){
  c.save();c.fillStyle=col;c.strokeStyle=col;c.lineWidth=Math.max(1.5,s*.12);c.lineCap='round';
  c.beginPath();c.ellipse(x-s*.18,y+s*.42,s*.34,s*.24,-.4,0,Math.PI*2);c.fill();
  c.beginPath();c.moveTo(x+s*.14,y+s*.36);c.lineTo(x+s*.14,y-s*.78);c.stroke();
  c.restore();
}
function glyphEighth(c,x,y,s,col){
  glyphQuarter(c,x,y,s,col);
  c.save();c.strokeStyle=col;c.lineWidth=Math.max(1.5,s*.12);c.lineCap='round';
  c.beginPath();c.moveTo(x+s*.14,y-s*.78);c.bezierCurveTo(x+s*.2,y-s*.4,x+s*.62,y-s*.42,x+s*.5,y);c.stroke();
  c.restore();
}
function glyphBeamed(c,x,y,s,col){
  c.save();c.fillStyle=col;c.strokeStyle=col;c.lineWidth=Math.max(1.5,s*.12);c.lineCap='round';
  [x-s*.5,x+s*.5].forEach(function(h){
    c.beginPath();c.ellipse(h-s*.18,y+s*.42,s*.34,s*.24,-.4,0,Math.PI*2);c.fill();
    c.beginPath();c.moveTo(h+s*.14,y+s*.36);c.lineTo(h+s*.14,y-s*.78);c.stroke();
  });
  c.lineWidth=s*.26;c.lineCap='butt';
  c.beginPath();c.moveTo(x-s*.5+s*.14,y-s*.7);c.lineTo(x+s*.5+s*.14,y-s*.7);c.stroke();
  c.restore();
}
function glyphRest(c,x,y,s,col){
  c.save();c.strokeStyle=col;c.lineWidth=Math.max(1.8,s*.2);c.lineCap='round';c.lineJoin='round';
  c.beginPath();c.moveTo(x-s*.18,y-s*.85);c.lineTo(x+s*.22,y-s*.4);c.lineTo(x-s*.2,y+s*.05);c.lineTo(x+s*.2,y+s*.5);
  c.quadraticCurveTo(x-s*.35,y+s*.42,x-s*.12,y+s*.9);c.stroke();
  c.restore();
}
function rrect(c,x,y,w,h,r){
  c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);
  c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();
}

/* ---------- drawing ---------- */
function layout(){
  var laneW=Math.min(W*.8,300),hitY=Math.round(H*.72);
  L={laneW:laneW,x0:(W-laneW)/2,cx:W/2,hitY:hitY,ppb:hitY/4};
}
function drawTarget(type,x,y,o){
  o=o||{};
  g.save();g.globalAlpha=o.a===undefined?1:o.a;
  if(type==='Q'){
    g.shadowColor=o.gray?'transparent':C.q;g.shadowBlur=12;
    g.fillStyle=o.gray?C.gray:C.q;g.beginPath();g.arc(x,y,22,0,Math.PI*2);g.fill();
    g.shadowBlur=0;glyphQuarter(g,x,y-1,19,C.ink);
  }else if(type==='E'){
    g.shadowColor=o.gray?'transparent':C.e;g.shadowBlur=10;
    g.fillStyle=o.gray?C.gray:C.e;g.beginPath();g.arc(x,y,16,0,Math.PI*2);g.fill();
    g.shadowBlur=0;glyphEighth(g,x-1,y-1,14,C.ink);
  }else{
    g.fillStyle=o.red?'rgba(240,80,62,.25)':'rgba(154,166,216,.16)';
    rrect(g,x-22,y-22,44,44,10);g.fill();
    g.setLineDash([5,4]);g.lineWidth=2;g.strokeStyle=o.red?C.red:C.r;rrect(g,x-22,y-22,44,44,10);g.stroke();
    g.setLineDash([]);glyphRest(g,x,y,15,o.red?C.red:C.r);
  }
  g.restore();
}
function drawNinja(now){
  var scale=clamp((H-L.hitY)/150,.55,1),nx=L.cx,ny=L.hitY+(H-L.hitY)*.5+4;
  var age=now-S.slashAt,swing=age<.14?age/.14:1,sway=Math.sin(now*3)*1.5;
  g.save();g.translate(nx,ny);g.scale(scale,scale);
  g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(0,34,26,6,0,0,Math.PI*2);g.fill();
  var tail=Math.sin(now*5)*4;
  g.fillStyle=C.red;
  g.beginPath();g.moveTo(-14,-22);g.lineTo(-34,-20+tail);g.lineTo(-30,-14+tail);g.lineTo(-14,-16);g.closePath();g.fill();
  g.fillStyle='#0B0F22';g.strokeStyle='rgba(255,255,255,.22)';g.lineWidth=1.5;
  g.beginPath();g.ellipse(0,18,19,20,0,0,Math.PI*2);g.fill();g.stroke();
  g.beginPath();g.arc(0,-6+sway*.3,17,0,Math.PI*2);g.fill();g.stroke();
  g.fillStyle='#F2D3B8';rrect(g,-12,-13+sway*.3,24,9,4);g.fill();
  g.fillStyle='#0B0F22';
  g.beginPath();g.ellipse(-5,-8.5+sway*.3,2.2,2.6,0,0,Math.PI*2);g.fill();
  g.beginPath();g.ellipse(5,-8.5+sway*.3,2.2,2.6,0,0,Math.PI*2);g.fill();
  g.fillStyle=C.red;rrect(g,-17,-22+sway*.3,34,6,3);g.fill();
  var a=age<.14?(-1.5+swing*2.6)*S.slashDir:-.55,hx=16,hy=12,len=42;
  var ex=hx+Math.sin(a)*len,ey=hy-Math.cos(a)*len;
  g.lineCap='round';g.strokeStyle='#DCE6FF';g.lineWidth=4;g.beginPath();g.moveTo(hx,hy);g.lineTo(ex,ey);g.stroke();
  g.strokeStyle=C.gold;g.lineWidth=5;g.beginPath();g.moveTo(hx-Math.cos(a)*5,hy-Math.sin(a)*5);g.lineTo(hx+Math.cos(a)*5,hy+Math.sin(a)*5);g.stroke();
  g.restore();
}
function draw(now){
  g.setTransform(DPR,0,0,DPR,0,0);
  var bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#10152C');bg.addColorStop(1,'#1A2146');
  g.fillStyle=bg;g.fillRect(0,0,W,H);
  var cb=curBeat(now),i,j;
  [.05,.12,.88,.95].forEach(function(f,k){
    var x=W*f;g.fillStyle='rgba(70,220,203,.06)';g.fillRect(x-5,0,10,H);
    g.fillStyle='rgba(70,220,203,.12)';
    for(var y=-90+((cb*L.ppb*.35+k*37)%90);y<H;y+=90) g.fillRect(x-7,y,14,4);
  });
  g.fillStyle='rgba(255,255,255,.04)';g.fillRect(L.x0,0,L.laneW,H);
  g.strokeStyle='rgba(255,255,255,.08)';g.lineWidth=1;
  g.beginPath();g.moveTo(L.x0,0);g.lineTo(L.x0,H);g.moveTo(L.x0+L.laneW,0);g.lineTo(L.x0+L.laneW,H);g.stroke();

  var vis=S.measures.filter(function(m){return !(m.startBeat+4<cb-1.5||m.startBeat>cb+4.5);});
  vis.forEach(function(m){
    for(var i=0;i<4;i++){
      var y=L.hitY-(m.startBeat+i-cb)*L.ppb;
      if(y<-10||y>H+10) continue;
      g.strokeStyle=i===0?'rgba(255,255,255,.28)':'rgba(255,255,255,.10)';g.lineWidth=i===0?2:1;
      g.beginPath();g.moveTo(L.x0,y);g.lineTo(L.x0+L.laneW,y);g.stroke();
      if(!m.isCount){
        g.textAlign='center';g.textBaseline='middle';
        g.fillStyle=i===0?C.paper:C.mute;g.font='700 14px '+FN;g.fillText(String(i+1),L.x0+15,y-11);
        if(S.hints){
          var yh=y-L.ppb*.5;
          if(yh>-10&&yh<H+10){g.fillStyle='rgba(152,163,214,.45)';g.font='500 12px '+FN;g.fillText('&',L.x0+15,yh);}
        }
      }
    }
  });

  var gl=g.createLinearGradient(0,L.hitY-34,0,L.hitY+34);
  var fa=now-S.flashAt<.16?(1-(now-S.flashAt)/.16)*.35:0;
  gl.addColorStop(0,'rgba(255,201,77,0)');gl.addColorStop(.5,'rgba(255,201,77,'+(.16+fa)+')');gl.addColorStop(1,'rgba(255,201,77,0)');
  g.fillStyle=gl;g.fillRect(L.x0,L.hitY-34,L.laneW,68);
  g.strokeStyle=C.gold;g.lineWidth=3;g.beginPath();g.moveTo(L.x0,L.hitY);g.lineTo(L.x0+L.laneW,L.hitY);g.stroke();
  g.strokeStyle='rgba(255,201,77,.8)';g.lineWidth=2;g.beginPath();g.arc(L.cx,L.hitY,27,0,Math.PI*2);g.stroke();

  vis.forEach(function(m){
    m.events.forEach(function(ev){
      var y=L.hitY-(ev.beat-cb)*L.ppb;
      if(y<-40||y>H+40) return;
      var st=ev.status;
      if(st==='perfect'||st==='good') return;
      if(ev.type==='E'&&ev.sub===0&&ev.partner){
        var p=ev.partner,both=(st==='pending'||st==='miss')&&(p.status==='pending'||p.status==='miss');
        if(both){
          var y2=L.hitY-(p.beat-cb)*L.ppb,gray=st==='miss'&&p.status==='miss';
          g.fillStyle=gray?'rgba(91,99,137,.35)':'rgba(70,220,203,.22)';
          rrect(g,L.cx-21,y2-21,42,y-y2+42,21);g.fill();
        }
      }
      if(ev.type==='R'){
        if(st==='rest-ok') drawTarget('R',L.cx,y,{a:.35});
        else if(st==='rest-broken') drawTarget('R',L.cx,y,{red:true,a:.8});
        else drawTarget('R',L.cx,y);
      }else if(st==='miss'){
        drawTarget(ev.type,L.cx,y,{gray:true,a:.5});
      }else drawTarget(ev.type,L.cx,y);
      if(S.hints&&ev.sub===0&&(st==='pending'||st==='miss')){
        var ly=ev.type==='E'?y-L.ppb*.25:y;
        g.textAlign='left';g.textBaseline='middle';g.font='700 13px '+FB;
        g.fillStyle=ev.type==='Q'?C.q:ev.type==='E'?C.e:C.r;
        g.globalAlpha=st==='miss'?.4:.9;
        g.fillText(ev.type==='Q'?'ta':ev.type==='E'?'ti-ti':'(休)',L.cx+(ev.type==='E'?30:34),ly);
        g.globalAlpha=1;
      }
    });
  });

  var m0=S.measures[0];
  if(m0&&S.phase==='play'&&cb<4){
    g.textAlign='center';g.textBaseline='middle';g.fillStyle=C.gold;
    g.font='900 '+(cb<0?40:76)+'px '+FD;
    g.fillText(cb<0?'準備':String(Math.floor(cb)+1),L.cx,H*.3);
    g.font='500 14px '+FB;g.fillStyle=C.mute;g.fillText('聽節拍器,在心裡跟著數',L.cx,H*.3+(cb<0?36:56));
  }

  S.fx=S.fx.filter(function(f){return now-f.t<f.life;});
  S.fx.forEach(function(f){
    var age=now-f.t,p=age/f.life;
    if(f.k==='text'){
      g.save();g.globalAlpha=1-p*p;g.textAlign='center';g.textBaseline='middle';
      g.font='900 '+f.size+'px '+FD;g.lineWidth=4;g.strokeStyle='rgba(10,13,30,.8)';
      g.strokeText(f.text,f.x,f.y-age*38);g.fillStyle=f.color;g.fillText(f.text,f.x,f.y-age*38);g.restore();
    }else if(f.k==='split'){
      [-1,1].forEach(function(sg){
        g.save();g.translate(f.x+sg*p*46,f.y+p*p*70);g.rotate(sg*p*.9);g.translate(-f.x,-f.y);
        g.beginPath();g.rect(sg<0?f.x-60:f.x,f.y-60,60,120);g.clip();
        drawTarget(f.type,f.x,f.y,{a:1-p});g.restore();
      });
    }
  });
  var sa=now-S.slashAt;
  if(sa<.16&&sa>=0){
    var d=S.slashDir;
    g.save();g.globalAlpha=1-sa/.16;g.lineCap='round';
    g.strokeStyle='#fff';g.shadowColor=C.gold;g.shadowBlur=14;g.lineWidth=4;
    g.beginPath();g.moveTo(L.cx-d*70,L.hitY-34);g.lineTo(L.cx+d*70,L.hitY+34);g.stroke();g.restore();
  }
  drawNinja(now);
}

/* ---------- flow ---------- */
function freshStats(){return {Q:{n:0,ok:0},E:{n:0,ok:0},R:{n:0,ok:0}};}
function show(id){$(id).hidden=false;}
function hide(id){$(id).hidden=true;}
function startGame(){
  initAudio();
  if(S.ctx&&S.ctx.state==='suspended') S.ctx.resume();
  var cfg=START[S.startKey];
  S.ai=makeAI(cfg.level,cfg.bpm);
  S.measures=[];S.pending=[];S.fx=[];S.summary=[];
  S.score=0;S.combo=0;S.maxCombo=0;S.extras=0;S.stats=freshStats();S.done=false;
  S.t0=clock()+.9;
  addMeasure(true);
  S.phase='play';
  setCoach(cfg.level===1?'聽節拍器的聲音。四分音符一拍點一下,準備!':'三種音符都會出現,專心跟著節拍!');
  hide('#menu');hide('#result');hide('#pauseOv');
}
function pauseGame(){
  if(S.phase!=='play') return;
  S.phase='paused';
  if(S.ctx) S.ctx.suspend();
  show('#pauseOv');
}
function resumeGame(){
  if(S.phase!=='paused') return;
  hide('#pauseOv');
  if(S.ctx) S.ctx.resume();
  S.phase='play';
}
function toMenu(){
  S.phase='menu';
  if(S.ctx&&S.ctx.state==='suspended') S.ctx.resume();
  S.measures=[];S.pending=[];S.fx=[];
  hide('#pauseOv');hide('#result');show('#menu');
  S.ai=makeAI(START[S.startKey].level,START[S.startKey].bpm);
  setCoach('按「開始修練」,跟著節拍器出發。');
  renderBest();
}
function loadBest(){try{return JSON.parse(localStorage.getItem('beat-ninja-best')||'null');}catch(e){return null;}}
function saveBest(b){try{localStorage.setItem('beat-ninja-best',JSON.stringify(b));}catch(e){}}
function renderBest(){
  var b=loadBest(),el=$('#bestLine');
  if(b){el.hidden=false;el.textContent='你的最佳:正確率 '+b.acc+'% · 最高到「'+b.rank+'」· '+b.score+' 分';}
  else el.hidden=true;
}
function starSvg(on){
  return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z" fill="'+(on?C.gold:'rgba(255,255,255,.12)')+'"/></svg>';
}
function finishGame(){
  if(S.done) return;
  S.done=true;S.phase='done';
  var st=S.stats,n=0,ok=0,k;
  for(k in st){n+=st[k].n;ok+=st[k].ok;}
  var acc=n?ok/(n+S.extras):0,pct=Math.round(acc*100);
  var stars=acc>=.9?3:acc>=.75?2:acc>=.5?1:0;
  var head=['慢慢來,先把四分音符練穩。','有進步,再練一回合!','很穩,再快一點就更厲害!','忍者大師級的節奏感!'][stars];
  var maxLv=S.ai.st.maxLevel,rank=S.ai.names[maxLv-1];
  var accs={};
  ['Q','E','R'].forEach(function(t){accs[t]=st[t].n?st[t].ok/st[t].n:null;});
  var tips={E:'八分音符:心裡數「1 & 2 &」,一拍裡點兩下。',R:'休止符:手停住,心裡繼續數拍子。',Q:'四分音符:跟著節拍器的「嗒」聲點。'};
  var parts=[];
  if(S.extras>=5) parts.push('有幾次點太多下,看準金線再點。');
  var cand=['E','R','Q'].filter(function(t){return accs[t]!==null;}).sort(function(a,b){return accs[a]-accs[b];})[0];
  if(cand&&accs[cand]<.8) parts.push(tips[cand]);
  if(!parts.length) parts.push('節奏很穩!下次可以挑戰更高的起始等級。');
  var bars='';
  ['Q','E','R'].forEach(function(t){
    if(accs[t]===null) return;
    var p=Math.round(accs[t]*100),col=t==='Q'?C.q:t==='E'?C.e:C.r;
    bars+='<div class="brow"><span>'+TYPE_NAME[t]+'</span><div class="track"><div class="fill" style="width:'+p+'%;background:'+col+'"></div></div><span>'+p+'%</span></div>';
  });
  var traj='';
  S.summary.slice().sort(function(a,b){return a.idx-b.idx;}).forEach(function(x){
    var a=x.tot?x.ok/x.tot:0,col=a>=.9?C.teal:a>=.7?C.gold:C.red;
    traj+='<div><i style="height:'+Math.max(8,Math.round(a*100))+'%;background:'+col+'"></i><em>'+x.bpm+'</em></div>';
  });
  $('#resultBody').innerHTML=
    '<div class="res-h"><div class="stars">'+starSvg(stars>=1)+starSvg(stars>=2)+starSvg(stars>=3)+'</div>'+
    '<h2>'+head+'</h2><p>修練完成,16 小節</p></div>'+
    '<div class="grid4"><div class="kv"><small>正確率</small><b>'+pct+'%</b></div>'+
    '<div class="kv"><small>分數</small><b>'+S.score+'</b></div>'+
    '<div class="kv"><small>最高連擊</small><b>'+S.maxCombo+'</b></div>'+
    '<div class="kv"><small>最高等級</small><b class="t">'+rank+'</b></div></div>'+
    '<div class="bars">'+bars+'</div>'+
    '<div><div class="traj">'+traj+'</div><p class="cap">每一條是一個小節的正確率,下方數字是當時的速度(每分鐘拍數)。最快到 '+S.ai.st.maxBpm+' 拍。</p></div>'+
    '<div class="note"><div class="seal" aria-hidden="true">師</div><p>'+parts.join(' ')+'</p></div>'+
    '<button class="go" id="btnAgain" type="button">再練一回合</button>'+
    '<button class="go alt" id="btnHome" type="button">回首頁</button>';
  $('#btnAgain').onclick=startGame;
  $('#btnHome').onclick=toMenu;
  var best=loadBest();
  if(!best||pct>best.acc||(pct===best.acc&&S.score>best.score)) saveBest({acc:pct,rank:rank,score:S.score});
  show('#result');
}

/* ---------- setup ---------- */
function resize(){
  W=stage.clientWidth;H=stage.clientHeight;DPR=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);layout();
}
function drawCards(){
  var d=Math.min(window.devicePixelRatio||1,2);
  document.querySelectorAll('.card canvas').forEach(function(c){
    var w=84,h=62;c.width=w*d;c.height=h*d;
    var x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);
    var k=c.getAttribute('data-k');
    if(k==='Q') glyphQuarter(x,w/2,h/2,34,C.q);
    else if(k==='E') glyphBeamed(x,w/2,h/2,26,C.e);
    else glyphRest(x,w/2,h/2,26,C.r);
  });
}
function tapEvt(e){e.preventDefault();$('#tap').classList.add('down');onTap();}
function bind(){
  stage.addEventListener('pointerdown',tapEvt);
  $('#tap').addEventListener('pointerdown',tapEvt);
  var up=function(){$('#tap').classList.remove('down');};
  window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
  window.addEventListener('keydown',function(e){
    if(e.repeat) return;
    if(e.code==='Space'||e.code==='KeyF'||e.code==='KeyJ'||e.code==='KeyD'||e.code==='KeyK'){
      if(S.phase==='play'){e.preventDefault();$('#tap').classList.add('down');onTap();}
    }else if(e.code==='Escape'||e.code==='KeyP'){
      if(S.phase==='play') pauseGame(); else if(S.phase==='paused') resumeGame();
    }
  });
  window.addEventListener('keyup',function(e){
    if(e.code==='Space') e.preventDefault();
    $('#tap').classList.remove('down');
  });
  document.addEventListener('visibilitychange',function(){if(document.hidden) pauseGame();});
  $('#btnPause').addEventListener('click',pauseGame);
  $('#btnResume').addEventListener('click',resumeGame);
  $('#btnQuit').addEventListener('click',toMenu);
  $('#btnStart').addEventListener('click',startGame);
  $('#segStart').addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b) return;
    S.startKey=+b.getAttribute('data-k');
    this.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false');});
    S.ai=makeAI(START[S.startKey].level,START[S.startKey].bpm);
  });
  $('#optHints').addEventListener('change',function(){S.hints=this.checked;});
  $('#optLat').addEventListener('input',function(){
    S.latency=+this.value;$('#optLatOut').textContent=(S.latency>0?'+':'')+S.latency+' 毫秒';
  });
}
function frame(){
  requestAnimationFrame(frame);
  var now=clock();
  if(S.phase==='play'){ensureMeasures(now);scheduleClicks(now);update(now);checkEnd(now);hud(now);}
  draw(now);
}

S.stats=freshStats();
S.ai=makeAI(START[1].level,START[1].bpm);
new ResizeObserver(resize).observe(stage);
resize();drawCards();bind();renderBest();
setText('#hBpm',String(START[1].bpm));setText('#hLv','Lv1 '+S.ai.names[0]);
requestAnimationFrame(frame);
})();
</script>

</body></html>
